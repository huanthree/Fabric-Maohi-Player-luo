name: Build Maohi Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            echo "ERROR: PRIVATE_REPO_TOKEN is missing"
            exit 1
          fi

          if [ -z "${{ secrets.CONFIG }}" ]; then
            echo "ERROR: CONFIG is missing"
            exit 1
          fi

          echo "Required secrets are present"

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Fabric-Maohi-Player-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
          cache-disabled: true

      - name: Move private source to workspace
        shell: bash
        run: |
          shopt -s dotglob
          cp -r private-repo/* .
          rm -rf private-repo

      - name: Clean loom cache
        shell: bash
        run: |
          rm -rf ~/.gradle/caches/fabric-loom .gradle/loom-cache

      - name: Download Carpet jar
        shell: bash
        run: |
          mkdir -p libs
          curl -L --retry 3 --fail -o libs/fabric-carpet.jar \
            "https://cdn.modrinth.com/data/TQTTVgYE/versions/HzPcczDK/fabric-carpet-1.21.11-1.4.194%2Bv251223.jar"
          ls -lh libs/fabric-carpet.jar
          python3 -c "import zipfile; zipfile.ZipFile('libs/fabric-carpet.jar').testzip(); print('JAR OK')"

      - name: Build with Gradle
        shell: bash
        run: gradle build --no-daemon
        env:
          CONFIG: ${{ secrets.CONFIG }}

      - name: Get JAR file name
        id: jar_name
        shell: bash
        run: |
          JAR_FILE=$(find build/libs -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" | head -1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No release jar found in build/libs"
            exit 1
          fi

          echo "jar_file=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "Found JAR file: $JAR_FILE"

      - name: Delete existing release and tag
        shell: bash
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated latest build generated by GitHub Actions.
          files: ${{ steps.jar_name.outputs.jar_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maohi-latest-build
          path: ${{ steps.jar_name.outputs.jar_file }}
          retention-days: 60
